<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Radar Lab</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Money Radar <small>LAB</small></h1><p>Detecta dónde está detenido el dinero y qué hacer ahora.</p><input id="client" placeholder="Cliente"><input id="amount" type="number" placeholder="Monto COP"><textarea id="conversation" rows="10" placeholder="Pega conversación o contexto"></textarea><button id="analyze">ANALIZAR CASO</button><section id="result" hidden><h2>Diagnóstico</h2><div id="diagnosis"></div><h3>Acción</h3><p id="action"></p><textarea id="message" rows="5"></textarea><button id="copy">COPIAR MENSAJE</button><h3>Resultado</h3><div class="out"><button data-o="respondio">Respondió</button><button data-o="negocio">Negoció</button><button data-o="pago">Pagó</button><button data-o="no_pago">No pagó</button><button data-o="perdido">Perdido</button></div><input id="recovered" type="number" placeholder="Dinero recuperado"><button id="save">GUARDAR RESULTADO</button></section><hr><h2>Laboratorio</h2><div id="stats"></div><div id="history"></div></main><script src="app.js"></script></body></html>
