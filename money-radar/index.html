<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Radar MVP</title><link rel="stylesheet" href="styles.css"></head><body><main><header><h1>Money Radar</h1><p>Encuentra dónde está el dinero que necesita atención.</p></header><section class="card"><h2>Nuevo caso</h2><input id="client" placeholder="Cliente / negocio"><input id="amount" type="number" placeholder="Monto potencial COP"><textarea id="conversation" rows="9" placeholder="Pega conversación, cotización, factura o contexto"></textarea><button id="analyze">ANALIZAR</button></section><section id="result" class="card" hidden><div id="score"></div><h2>Diagnóstico</h2><div id="diagnosis"></div><h2>Qué hacer ahora</h2><p id="action"></p><textarea id="message" rows="5"></textarea><button id="copy">COPIAR MENSAJE</button><h2>Resultado</h2><div class="out"><button data-o="respondio">Respondió</button><button data-o="nego">Negoció</button><button data-o="pago">Pagó</button><button data-o="no_pago">No pagó</button><button data-o="perdido">Perdido</button></div><input id="recovered" type="number" placeholder="Dinero recuperado COP"><button id="save">GUARDAR RESULTADO</button></section><section class="card"><h2>Laboratorio</h2><div id="stats"></div><div id="history"></div></section></main><script src="app.js"></script></body></html>
