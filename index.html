<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Family Play — Supabase MVP</title>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    window.__createSupabaseClient = createClient;
  </script>
  <style>
    :root { --bg:#0b1020; --card:#151c32; --card2:#1b2542; --text:#f7f8fc; --muted:#aeb7cf; --accent:#7c5cff; --accent2:#21d4a3; --danger:#ff5c7a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#1b2850 0,#0b1020 45%); color:var(--text); min-height:100vh; }
    .wrap { max-width:900px; margin:auto; padding:24px 16px 50px; }
    .brand { text-align:center; margin:8px 0 24px; }
    .brand h1 { margin:0; font-size:38px; }
    .brand p { color:var(--muted); margin:8px 0 0; }
    .card { background:rgba(21,28,50,.94); border:1px solid rgba(255,255,255,.08); border-radius:22px; padding:20px; margin:14px 0; box-shadow:0 15px 45px rgba(0,0,0,.22); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    input,button,select,textarea { width:100%; border-radius:14px; border:1px solid rgba(255,255,255,.12); padding:13px 14px; font:inherit; }
    input,select,textarea { background:#0f1629; color:var(--text); }
    button { background:var(--accent); color:white; font-weight:750; cursor:pointer; border:0; }
    button.secondary { background:var(--card2); }
    button.good { background:var(--accent2); color:#06151a; }
    button.danger { background:var(--danger); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .pill { display:inline-flex; padding:7px 11px; border-radius:999px; background:#222d4e; color:#dce3f8; font-size:13px; }
    .room { font-size:34px; font-weight:900; letter-spacing:5px; text-align:center; padding:14px; background:#0d1427; border-radius:16px; margin:10px 0; }
    .players { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .player { background:#10182d; border-radius:16px; padding:14px; text-align:center; border:1px solid rgba(255,255,255,.07); }
    .avatar { width:68px; height:68px; border-radius:50%; margin:0 auto 8px; display:grid; place-items:center; font-size:32px; background:linear-gradient(135deg,#7c5cff,#21d4a3); }
    .status { color:var(--muted); font-size:13px; }
    .big { font-size:22px; font-weight:800; line-height:1.25; }
    .question { background:#0f1629; border-radius:18px; padding:18px; margin:14px 0; }
    .choice { text-align:left; margin:7px 0; background:#222d4e; }
    .choice.selected { outline:3px solid var(--accent2); }
    .notice { padding:12px 14px; border-radius:14px; background:#102c29; color:#cafff0; }
    .error { background:#381725; color:#ffd9e0; }
    .hidden { display:none !important; }
    .small { font-size:12px; color:var(--muted); }
    .center { text-align:center; }
    .timer { font-size:42px; font-weight:900; text-align:center; margin:8px 0; }
    .vote-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
    footer { text-align:center; color:#6f7891; font-size:12px; margin-top:25px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>🎭 Family Play</h1>
    <p>Una familia. Una pantalla. Todos conectados.</p>
  </div>

  <section id="home" class="card">
    <h2>Comenzar</h2>
    <div class="grid">
      <div>
        <h3>Crear sala</h3>
        <input id="hostName" placeholder="Tu nombre" maxlength="24">
        <button id="createBtn">Crear sala</button>
      </div>
      <div>
        <h3>Unirse a una sala</h3>
        <input id="joinName" placeholder="Tu nombre" maxlength="24">
        <input id="joinCode" placeholder="Código (ej. ABC12)" maxlength="5" style="margin-top:8px;text-transform:uppercase">
        <button id="joinBtn" style="margin-top:8px">Unirme</button>
      </div>
    </div>
    <div id="homeMsg" class="notice hidden" style="margin-top:14px"></div>
  </section>

  <section id="lobby" class="card hidden">
    <div class="center">
      <div class="small">CÓDIGO DE LA SALA</div>
      <div id="roomCode" class="room">-----</div>
      <div id="connection" class="pill">Conectando…</div>
    </div>
    <h2>Jugadores</h2>
    <div id="players" class="players"></div>
    <div id="hostControls" class="hidden" style="margin-top:18px">
      <button id="startBtn" class="good">▶ Empezar Family Play</button>
    </div>
    <div id="waiting" class="notice center" style="margin-top:14px">Esperando al anfitrión…</div>
  </section>

  <section id="game" class="card hidden">
    <div class="row" style="justify-content:space-between">
      <span id="roundLabel" class="pill">Ronda 1</span>
      <span id="phaseLabel" class="pill">Preparando</span>
    </div>
    <div id="gameContent"></div>
  </section>

  <section id="result" class="card hidden">
    <div class="center">
      <div class="big">🏆 Resultado</div>
      <div id="resultContent" style="margin-top:12px"></div>
    </div>
  </section>

  <footer>Family Play MVP • Realtime con Supabase</footer>
</div>

<script type="module">
const SUPABASE_URL = "https://hbivgvetklqgiclxtyos.supabase.co";
const SUPABASE_KEY = "sb_publishable_7C_LWcZfqN-6TcxDURNB7A_wcvyxoKL";
const supabase = window.__createSupabaseClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const state = {
  me:null, room:null, channel:null, isHost:false,
  players:{}, phase:"lobby", round:0, targetId:null, controllerId:null,
  controllerChoice:null, votes:{}, assignments:{}
};

const situations = [
  {q:"Llegas a un restaurante y te cobraron $20.000 de más. ¿Qué haces?", a:["Lo reclamo inmediatamente 😤","Me río y pago 😅","Llamo al mesero con mucha calma 😎"]},
  {q:"Te encuentras $50.000 en la calle. ¿Qué harías?", a:["Busco al dueño","Me lo guardo","Pregunto alrededor y espero"]},
  {q:"Tu familia propone un viaje y nadie quiere organizarlo. Tú…", a:["Tomo el control","Espero a que otro lo haga","Propongo votar entre todos"]},
  {q:"Te llega un mensaje: “Tenemos que hablar”. Tu reacción es…", a:["Me preocupo 😳","Pregunto de una vez","Sigo con mi día"]},
  {q:"En una reunión familiar ponen una canción que odias. Tú…", a:["La cambio discretamente","Me aguanto","Empiezo a bailarla de broma"]},
];

function msg(text, error=false) {
  $("homeMsg").textContent = text;
  $("homeMsg").className = "notice" + (error ? " error" : "");
  $("homeMsg").classList.remove("hidden");
}
function show(id) {
  ["home","lobby","game","result"].forEach(x => $(x).classList.toggle("hidden", x!==id));
}
function code() { return Math.random().toString(36).slice(2,7).toUpperCase(); }
function avatar(name) {
  const emojis=["😎","🤠","🦊","🐯","🐼","🐸","🦁","🐵","🐨","🐙"];
  let n=0; for (const c of name) n+=c.charCodeAt(0);
  return emojis[n%emojis.length];
}
function renderPlayers() {
  $("players").innerHTML = Object.values(state.players).map(p => `
    <div class="player">
      <div class="avatar">${p.emoji || avatar(p.name)}</div>
      <strong>${escapeHtml(p.name)}</strong>
      <div class="status">${p.id===state.me?.id ? "Tú" : (p.isHost ? "Anfitrión" : "Jugador")}</div>
    </div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}

async function connect(roomCode) {
  state.room = roomCode;
  state.channel = supabase.channel("family-play-"+roomCode, {
    config:{ broadcast:{self:false}, presence:{key:state.me.id} }
  });

  state.channel
    .on("broadcast",{event:"HELLO"},({payload})=>{
      if(state.isHost) {
        if(payload && payload.player) state.players[payload.player.id] = payload.player;
        sendState();
        renderPlayers();
      }
    })
    .on("broadcast",{event:"STATE"},({payload})=>{
      if(!state.isHost && payload?.state) applyState(payload.state);
    })
    .on("broadcast",{event:"START"},({payload})=>{
      if(payload?.roundState) {
        applyRoundState(payload.roundState);
        show("game");
        renderGame();
      }
    })
    .on("broadcast",{event:"CONTROLLER_CHOICE"},({payload})=>{
      if(state.isHost) {
        state.controllerChoice = payload.choice;
        state.phase="vote";
        sendState();
        renderGame();
      }
    })
    .on("broadcast",{event:"VOTE"},({payload})=>{
      if(state.isHost && payload?.voterId && payload?.targetId) {
        state.votes[payload.voterId]=payload.targetId;
        sendState();
        renderGame();
        if(Object.keys(state.votes).length >= Object.keys(state.players).length) reveal();
      }
    });

  const status = await state.channel.subscribe(async (status)=>{
    $("connection").textContent = status === "SUBSCRIBED" ? "🟢 Conectado" : "🟡 "+status;
    if(status === "SUBSCRIBED") {
      await state.channel.track({id:state.me.id,name:state.me.name,isHost:state.isHost});
      if(!state.isHost) {
        await broadcast("HELLO",{player:state.me});
      } else {
        state.players[state.me.id]=state.me;
        renderPlayers();
      }
    }
  });
}

async function broadcast(event,payload) {
  if(state.channel) await state.channel.send({type:"broadcast",event,payload});
}
function snapshot(){
  return {
    players:state.players, phase:state.phase, round:state.round,
    targetId:state.targetId, controllerId:state.controllerId,
    controllerChoice:state.controllerChoice, votes:state.votes
  };
}
function sendState(){ broadcast("STATE",{state:snapshot()}); }
function applyState(s){
  Object.assign(state,{players:s.players||{},phase:s.phase||"lobby",round:s.round||0,targetId:s.targetId||null,controllerId:s.controllerId||null,controllerChoice:s.controllerChoice||null,votes:s.votes||{}});
  renderPlayers();
  if(state.phase==="lobby"){show("lobby");$("waiting").classList.remove("hidden");}
  else {show("game");renderGame();}
}
function applyRoundState(s){
  Object.assign(state,{round:s.round,targetId:s.targetId,controllerId:s.controllerId,controllerChoice:s.controllerChoice||null,votes:s.votes||{},phase:s.phase||"controller"});
  if(s.players) state.players=s.players;
  renderPlayers(); renderGame();
}

$("createBtn").onclick=async()=>{
  const name=$("hostName").value.trim();
  if(!name) return msg("Escribe tu nombre.",true);
  state.me={id:crypto.randomUUID(),name,isHost:true,emoji:avatar(name)};
  state.isHost=true; state.room=code();
  $("roomCode").textContent=state.room;
  show("lobby"); $("hostControls").classList.remove("hidden"); $("waiting").classList.add("hidden");
  try { await connect(state.room); } catch(e){ msg("No fue posible conectar: "+e.message,true); show("home"); }
};
$("joinBtn").onclick=async()=>{
  const name=$("joinName").value.trim(), room=$("joinCode").value.trim().toUpperCase();
  if(!name || room.length!==5) return msg("Escribe nombre y un código de 5 caracteres.",true);
  state.me={id:crypto.randomUUID(),name,isHost:false,emoji:avatar(name)};
  state.isHost=false;
  $("roomCode").textContent=room;
  show("lobby");
  try { await connect(room); } catch(e){ msg("No fue posible conectar: "+e.message,true); show("home"); }
};

$("startBtn").onclick=async()=>{
  const ids=Object.keys(state.players);
  if(ids.length<2){ alert("Necesitamos al menos 2 jugadores para probar."); return; }
  startRound();
};

function startRound(){
  state.round++;
  state.phase="controller";
  state.votes={}; state.controllerChoice=null;
  const ids=Object.keys(state.players);
  state.targetId=ids[Math.floor(Math.random()*ids.length)];
  const possible=ids.filter(x=>x!==state.targetId);
  state.controllerId=possible[Math.floor(Math.random()*possible.length)];
  const rs={round:state.round,phase:"controller",targetId:state.targetId,controllerId:state.controllerId,controllerChoice:null,votes:{},players:state.players};
  broadcast("START",{roundState:rs});
  sendState();
  renderGame();
}

function renderGame(){
  $("roundLabel").textContent="Ronda "+state.round;
  $("phaseLabel").textContent=state.phase==="controller"?"🎭 Suplantación":state.phase==="vote"?"🗳️ Votación":"🏁 Resultado";
  const target=state.players[state.targetId];
  const situation=situations[(state.round-1)%situations.length];

  if(state.phase==="controller"){
    if(state.me.id===state.controllerId){
      $("gameContent").innerHTML=`
        <div class="question">
          <div class="small">TÚ CONTROLAS EL AVATAR DE</div>
          <div class="big">${avatar(target?.name||"")} ${escapeHtml(target?.name||"Jugador")}</div>
          <p>${escapeHtml(situation.q)}</p>
          <p class="small">Responde como crees que respondería esa persona. Los demás no sabrán que eres tú.</p>
          ${situation.a.map((x,i)=>`<button class="choice" onclick="controllerAnswer(${i})">${escapeHtml(x)}</button>`).join("")}
        </div>`;
    } else {
      $("gameContent").innerHTML=`
        <div class="center">
          <div class="avatar">${avatar(target?.name||"")}</div>
          <div class="big">${escapeHtml(target?.name||"Jugador")} está en una situación…</div>
          <p class="small">Alguien de la familia está controlando este avatar. Espera la respuesta.</p>
          <div class="timer">🎭</div>
        </div>`;
    }
  } else if(state.phase==="vote"){
    const answer = situation.a[state.controllerChoice ?? 0];
    $("gameContent").innerHTML=`
      <div class="question">
        <div class="small">¿QUIÉN ESTÁ DETRÁS DEL AVATAR DE ${escapeHtml(target?.name||"JUGADOR")}?</div>
        <div class="big">${avatar(target?.name||"")} ${escapeHtml(target?.name||"Jugador")}</div>
        <p><strong>Situación:</strong> ${escapeHtml(situation.q)}</p>
        <p><strong>Respuesta:</strong> ${escapeHtml(answer)}</p>
      </div>
      <div class="vote-grid">
      ${Object.values(state.players).filter(p=>p.id!==state.targetId).map(p=>`
        <button class="choice" onclick="voteFor('${p.id}')" ${state.votes[state.me.id]?'disabled':''}>
          ${p.emoji||avatar(p.name)}<br>${escapeHtml(p.name)}
        </button>`).join("")}
      </div>
      <p class="small center">${Object.keys(state.votes).length}/${Object.keys(state.players).length} votos</p>`;
  } else {
    renderResult();
  }
}

window.controllerAnswer=async(choice)=>{
  if(state.me.id!==state.controllerId || state.phase!=="controller") return;
  state.controllerChoice=choice; state.phase="vote";
  await broadcast("CONTROLLER_CHOICE",{choice});
  sendState(); renderGame();
};
window.voteFor=async(targetId)=>{
  if(state.votes[state.me.id]) return;
  state.votes[state.me.id]=targetId;
  await broadcast("VOTE",{voterId:state.me.id,targetId});
  sendState(); renderGame();
  if(state.isHost && Object.keys(state.votes).length>=Object.keys(state.players).length) reveal();
};

function reveal(){
  state.phase="result";
  sendState(); renderResult(); show("game");
}
function renderResult(){
  const controller=state.players[state.controllerId];
  const target=state.players[state.targetId];
  const counts={};
  Object.values(state.votes).forEach(x=>counts[x]=(counts[x]||0)+1);
  const guessed=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const winner=guessed===state.controllerId;
  $("phaseLabel").textContent="🏁 Resultado";
  $("gameContent").innerHTML=`
    <div class="center">
      <div class="big">${winner?"🎉 ¡Lo descubrieron!":"😂 ¡Cayeron en la trampa!"}</div>
      <div class="question">
        <p>El avatar era de <strong>${escapeHtml(target?.name||"Jugador")}</strong>.</p>
        <p>Quien realmente lo controló fue <strong>${escapeHtml(controller?.name||"Jugador")}</strong>.</p>
        <p>La mayoría votó por <strong>${escapeHtml(state.players[guessed]?.name||"nadie")}</strong>.</p>
      </div>
      ${state.isHost?`<button class="good" onclick="nextRound()">▶ Siguiente ronda</button>`:"<p class='small'>Esperando al anfitrión…</p>"}
    </div>`;
}
window.nextRound=()=>{ if(state.isHost) startRound(); };

renderPlayers();
</script>
</body>
</html>
