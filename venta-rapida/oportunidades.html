<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oportunidades reales</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><span class="eyebrow">VENTA RÁPIDA · DATOS REALES</span><h1>Oportunidades para validar</h1><p>Ordenadas por evidencia de demanda y encaje con $300.000.</p></div><a href="index.html"><button>← Volver</button></a></header><div id="list"></div><p class="muted">Los costos marcados como referencia deben cotizarse con proveedor antes de comprar. No se presentan como precios mayoristas confirmados.</p></main><script src="radar.js"></script><script src="oportunidades.js"></script><script>const rows=OPPORTUNITIES.map(x=>{const o=x.marketPrice&&x.referenceCost?VR_RADAR.analyze({name:x.name,cost:x.referenceCost,sale:x.marketPrice,units:x.units,velocity:x.velocity,season:x.season,risk:x.risk}):null;return {x,o}}).sort((a,b)=>(b.o?.score||0)-(a.o?.score||0));document.querySelector("#list").innerHTML=rows.map(({x,o})=>'<div class="card" style="margin-bottom:12px"><div class="row"><h2>'+x.name+'</h2><span class="pill">'+(o?o.decision:"COTIZAR")+'</span></div><p>'+x.category+' · '+x.season+' · Riesgo '+x.risk+'</p><p><b>Evidencia:</b> '+x.proof+'</p>'+(o?'<div class="stats"><div><b>'+o.score+'/100</b><small>Score</small></div><div><b>$'+o.profit.toLocaleString("es-CO")+'</b><small>Utilidad/unidad</small></div><div><b>'+Math.round(o.margin)+'%</b><small>Margen</small></div><div><b>$'+o.capital.toLocaleString("es-CO")+'</b><small>Capital</small></div></div>':'<p class="warn">Falta precio mayorista real. No comprar hasta cotizar.</p>')+'</div>').join("")</script></body></html>
