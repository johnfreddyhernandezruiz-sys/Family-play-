<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar de Oportunidades</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><span class="eyebrow">VENTA RÁPIDA</span><h1>Radar de Oportunidades</h1><p>Decide dónde poner el capital antes de comprar.</p></div><a href="index.html"><button>← Volver</button></a></header><section class="card"><div class="row"><h2>Simulador de $300.000</h2><span class="pill">Objetivo: $100–$300/día</span></div><form id="f" class="grid"><input id="name" placeholder="Producto" required><input id="cost" type="number" placeholder="Costo unidad" required><input id="sale" type="number" placeholder="Precio venta" required><input id="units" type="number" placeholder="Unidades a comprar" required><input id="velocity" type="number" step=".1" placeholder="Ventas/día estimadas" required><select id="season"><option>Halloween</option><option>Navidad</option><option>Todo el año</option></select><select id="risk"><option>Bajo</option><option>Medio</option><option>Alto</option></select><button>Analizar</button></form><div id="out"></div></section></main><script src="radar.js"></script><script>const f=document.querySelector("#f");f.onsubmit=e=>{e.preventDefault();const o=VR_RADAR.analyze({name:name.value,cost:+cost.value,sale:+sale.value,units:+units.value,velocity:+velocity.value,season:season.value,risk:risk.value});out.innerHTML="<div class=card><h2>"+o.decision+" · "+o.score+"/100</h2><div class=stats><div><b>$"+o.capital.toLocaleString("es-CO")+"</b><small>Capital</small></div><div><b>$"+o.profit.toLocaleString("es-CO")+"</b><small>Utilidad/unidad</small></div><div><b>"+Math.round(o.margin)+"%</b><small>Margen</small></div><div><b>$"+Math.round(o.daily).toLocaleString("es-CO")+"</b><small>Utilidad diaria estimada</small></div></div><p><b>ROI:</b> "+Math.round(o.roi)+"% · <b>Capital disponible:</b> $300.000</p><p>"+(o.decision==="COMPRAR"?"✅ Encaja con la estrategia. Compra limitada y valida rotación.":o.decision==="PROBAR"?"🟡 Haz una prueba pequeña antes de comprometer capital.":"🔴 No pondría capital aquí con estos datos.")+"</p></div>"}</script></body></html>
